name: Refresh bundled tide data

# The app serves tide data from tides/ rather than from a CORS proxy, so a year
# that is not bundled falls back to the unreliable path. This keeps the next two
# years bundled without anyone having to remember.
on:
  schedule:
    # Monthly, on the 3rd
    - cron: '17 19 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tide tables from LINZ
        id: fetch
        run: ./fetch_tides.sh

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain tides/)" ]; then
            echo "Bundled tide data is already current."
            exit 0
          fi

          branch="chore/refresh-tides-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tides/
          git commit -m "Refresh bundled LINZ tide data"
          git push -u origin "$branch"

          gh pr create \
            --title "Refresh bundled LINZ tide data" \
            --body "Automated refresh of the CSVs in \`tides/\`, downloaded from LINZ and validated by \`fetch_tides.sh\`. Merge to publish." \
            --base main \
            --head "$branch"
